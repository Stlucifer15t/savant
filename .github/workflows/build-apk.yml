name: build apk

# Builds a debug APK on GitHub's runners (the dev sandbox has no Android SDK) and publishes it to
# a rolling release, so there is always one URL to download and install:
#   https://github.com/Stlucifer15t/savant/releases/download/savant-debug/app-debug.apk
#
# Runner logs live on a host the dev sandbox cannot reach, so a failing build also pushes its own
# log to the `ci-logs` branch (.ci/build.log), which is readable through the ordinary contents API.
#
# Every working session gets its own `arena/<id>-savant` branch, so the trigger is the pattern and
# not one branch name: a session whose branch is not listed here builds nothing, tests nothing and
# publishes nothing, and finds out late.

on:
  push:
    branches:
      - "arena/**"
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: make sure android sdk 35 is installed
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" "build-tools;35.0.0"
          fi

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: assemble debug apk
        shell: bash
        run: |
          set -eo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log

      - name: report apk
        run: |
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      # Room writes the exported schema during compilation. It belongs in git, so a later version
      # bump has something to diff against — and the sandbox cannot download artifacts, so this is
      # how the schema gets back. `[skip ci]` keeps the push from starting another run.
      - name: commit exported room schema
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/arena/')
        run: |
          if [ -d app/schemas ]; then
            git config user.name "savant ci"
            git config user.email "ci@savant.invalid"
            git add app/schemas
            if ! git diff --cached --quiet; then
              git commit -m "chore: exported room schema [skip ci]"
              # A rejection here means the branch moved while this run was building; the next push
              # carries the schema instead. Not worth failing an otherwise green build over.
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "schema push skipped, branch moved"
            fi
          fi

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: savant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: publish rolling release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NOTES="debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME} — $(date -u +%Y-%m-%dT%H:%MZ)

          install: allow 'install unknown apps' for your browser or file manager, then open the apk.
          savant edits offline single-player saves; do not point it at an online game.

          built by .github/workflows/build-apk.yml"
          gh release delete savant-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create savant-debug "$APK" \
            --title "savant debug build" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: unit tests
        shell: bash
        run: |
          set -eo pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee -a /tmp/gradle.log

      # Gradle's console line for a failed test is only `AssertionError at File.kt:12`, which is not
      # enough to fix anything from here. The junit xml has the expected and actual values.
      - name: collect test failure messages
        if: failure()
        run: |
          {
            echo "===== junit failures ====="
            find app/build/test-results -name '*.xml' 2>/dev/null | while read -r f; do
              grep -l '<failure' "$f" > /dev/null 2>&1 || continue
              echo "--- $f"
              tr '>' '>\n' < "$f" | grep -A 12 '<failure' | head -80
            done
          } >> /tmp/gradle.log 2>&1 || true

      # Runs whenever anything above failed. Pushes the gradle output to the ci-logs branch so it
      # can be read back through api.github.com; that branch has no workflow trigger, so no loop.
      - name: publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "savant ci"
          git config user.email "ci@savant.invalid"
          git checkout -B ci-logs
          mkdir -p .ci
          tail -c 600000 /tmp/gradle.log > .ci/build.log 2>/dev/null || echo "no gradle log" > .ci/build.log
          {
            echo "sha: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "job: $GITHUB_JOB"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .ci/run.txt
          git add -f .ci
          git commit -m "ci: build log for ${GITHUB_SHA::7}"
          git push -f origin ci-logs
